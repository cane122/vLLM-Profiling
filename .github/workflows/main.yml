name: Strix Halo Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      # 1. PRE-CHECKOUT FIX: Primeti crticu ispred "name" - to je popravilo stvar!
      - name: Pre-clean workspace
        if: always()
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine sh -c "rm -rf .logs .config __pycache__"
          fi

      # 2. Povlačenje koda
      - uses: actions/checkout@v4

      # 3. Priprema lokalnih foldera
      - name: Prepare workspace
        run: |
          mkdir -p .config
          mkdir -p .logs

      - name: Create tokens.yaml
        run: |
          echo "tokens: {}" > .config/tokens.yaml

      - name: Generate GPU config
        run: |
          scripts/host/generate_gpu_yaml.sh

      - name: Pull Docker image
        run: |
          docker pull hyoon11/vllm-dev:20260121_43_py3.12_torch2.9_triton3.5_navi_upstream_6a09612_ubuntu24.04

      # 4. Pokretanje ML workload-a
      - name: Run vLLM profiling
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -x
          python3 scripts/host/orchestrator.py \
            --duration 60 \
            Qwen/Qwen3-4B

      # 5. Čuvanje logova na GitHubu
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: profiling-logs
          path: logs/

      # 6. POST-EXECUTION FIX
      - name: Post-clean workspace permissions
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine sh -c "rm -rf .logs .config"