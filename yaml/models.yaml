# yaml/models.yaml
# defines the models and their default configurations

# Env priority:
# gpus.yaml/gpu/model > gpus.yaml/gpu/env > models.yaml/env

models:
  - name: meta-llama/Llama-2-70b-hf
    type: text
    script: qwen_text.py
    env:
      MAX_MODEL_LEN: '4096'
      SP_TEMPERATURE: '0.6'
      SP_MAX_TOKENS: '1024'
      GPU_MEM_UTIL: '0.92'
      TENSOR_PARALLEL_SIZE: '4'
      DTYPE: 'auto'

  - name: meta-llama/Llama-3.1-8B-Instruct
    type: text
    script: qwen_text.py
    env:
      MAX_MODEL_LEN: '8192'
      SP_TEMPERATURE: '0.6'
      SP_MAX_TOKENS: '1024'
      GPU_MEM_UTIL: '0.85'
      TENSOR_PARALLEL_SIZE: '1'
      DTYPE: 'auto'

  - name: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    type: text
    script: qwen_text.py
    env:
      MAX_MODEL_LEN: '4096'
      SP_TEMPERATURE: '0.6'
      SP_MAX_TOKENS: '1024'
      GPU_MEM_UTIL: '0.92'
      TENSOR_PARALLEL_SIZE: '4'
      DTYPE: 'auto'
      TRUST_REMOTE_CODE: '1'

  - name: openai/gpt-oss-120b
    type: text
    script: qwen_text.py
    env:
      MAX_MODEL_LEN: '4096'
      SP_TEMPERATURE: '0.6'
      SP_MAX_TOKENS: '1024'
      GPU_MEM_UTIL: '0.95'
      TENSOR_PARALLEL_SIZE: '4'
      DTYPE: 'auto'
      TRUST_REMOTE_CODE: '1'
